<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizon - Loan Document Preview</title>
<style>
  @page { size: Letter; margin: 0.399in 0.378in 0.47in 0.473in; }

  html, body { margin:0; padding:0; }
  body { padding-top:0.071in; }   /* page 1 only: banner sits lower than page-2 content */
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11pt;
    line-height: 1.5;
    color:#000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- brand banner ---------- */
  .banner { background:#BAEA02; height:1.247in; position:relative; }
  .banner img { position:absolute; left:0.845in; top:0.505in; width:1.435in; height:auto; }

  /* ---------- top reference strip ---------- */
  .ref-strip { text-align:right; font-size:11px; line-height:1.15; color:#767676;
               padding-right:11px; margin-top:13px; }

  /* ---------- salutation ---------- */
  .salutation { margin-left:0.100in; margin-top:38px; }
  .ref-line   { margin-left:0.100in; margin-top:15px; }

  /* ---------- statement block (indented column) ---------- */
  .statement { margin-left:0.796in; margin-right:0.790in; }

  h1.soa-title { font-size:13.75pt; font-weight:bold; line-height:1.15;
                 margin:33px 0 0 0; }

  table.meta { width:100%; border-collapse:collapse; margin-top:20px; }
  table.meta td { padding:0 0 0 4px; vertical-align:top; width:50%; }

  /* ---------- account summary box ---------- */
  table.summary { width:100%; border-collapse:collapse; margin-top:20px;
                  border:1px solid #ccc; }
  table.summary td { border:1px solid #ccc; padding:9px 9px; width:50%; }
  table.summary td.who { vertical-align:middle; }
  table.summary td.acct { vertical-align:top; }

  /* ---------- legend ---------- */
  .legend { font-weight:bold; margin-top:17px; }

  /* ---------- transactions ---------- */
  table.txn { width:100%; border-collapse:collapse; margin-top:19px;
              font-size:11px; line-height:1.15; }
  table.txn td { border:1px solid #000; padding:10.185px 6px; vertical-align:middle; }
  table.txn tr.head td { font-weight:bold; }
  table.txn td .fail { color:#FF0000; }   /* X = failed, P = pending */
  table.txn td.c-date { width:15%; }
  table.txn td.c-type { width:35%; }
  table.txn td.c-deb  { width:15%; }
  table.txn td.c-cred { width:15%; }
  table.txn td.c-bal  { width:20%; }

  /* ---------- closing page ---------- */
  .closing { page-break-before: always; }
  .totals { margin-left:0.302in; margin-top:17px; line-height:0.25in; }
  .signoff { margin-left:0.119in; margin-top:64px; }
  .signoff .cheers { margin-top:20px; }
  .signoff .team { font-weight:bold; }
  .phone { color:#ADCB07; font-weight:bold; }
  .contact { text-align:center; font-size:6.9pt; line-height:0.1535in;
             color:#3f3f3f; margin-top:43px; }
  .contact .lbl { font-weight:bold; color:#000; }
</style>
</head>
<body>
